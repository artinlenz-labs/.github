name: Bug
description: Something that worked or was specified behaves wrongly
type: Bug
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: Steps, where it happened (device, app, command, server) and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The test that fails before the fix and passes after it; one checklist item each. The local-gate merge guard requires this section.
      placeholder: "- [ ] ..."
    validations:
      required: true
