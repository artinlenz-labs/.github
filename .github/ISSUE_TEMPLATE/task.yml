name: Task
description: Work with no user-visible change (chores, refactors, infrastructure, docs)
type: Task
body:
  - type: textarea
    id: work
    attributes:
      label: What and why
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How anyone can tell the task is finished.
    validations:
      required: true
