name: Bug
description: Something that worked or was specified behaves wrongly
type: Bug
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: Steps, where it happened (device, app, command, server) and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The test that fails before the fix and passes after it.
